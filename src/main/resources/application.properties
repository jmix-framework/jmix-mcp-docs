spring.application.name=mcp-docs


## Logging
logging.level.root=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=DEBUG
logging.level.io.jmix=DEBUG

# Embedding Model Configuration
logging.level.org.springframework.ai.mcp=DEBUG
logging.level.io.modelcontextprotocol.server=DEBUG

jmix.ai.backend.url=${JMIX_AI_BACKEND_URL:http://localhost:8081}

spring.ai.mcp.server.sse-endpoint=/sse
spring.ai.mcp.server.sse-message-endpoint=/message
spring.ai.mcp.server.type=SYNC

# Rate Limiting Configuration
# Request-based rate limiting (number of requests)

# Per-IP rate limit: 300 requests per hour with burst capacity (x10)
rate-limit.ip.capacity=300
rate-limit.ip.refill-tokens=300
rate-limit.ip.refill-duration=1h

# Global rate limit: 800 requests per minute (DDoS protection, x4)
rate-limit.global.capacity=800
rate-limit.global.refill-tokens=800
rate-limit.global.refill-duration=1m

# Cache configuration for IP buckets
rate-limit.cache.max-size=10000
rate-limit.cache.expire-duration=1h

# Token Budget Configuration

# Token-based rate limiting (estimated input tokens)
# Per-IP token budgets (x10)
rate-limit.tokens.ip.per-minute=20000
rate-limit.tokens.ip.per-hour=100000
rate-limit.tokens.ip.per-day=500000

# Global token budgets (x4)
rate-limit.tokens.global.per-minute=40000
rate-limit.tokens.global.per-hour=400000
rate-limit.tokens.global.per-day=4000000

# Input Validation Configuration

# Maximum query length (characters)
rate-limit.input.max-query-length=10000
# Maximum estimated input tokens
rate-limit.input.max-estimated-input-tokens=2000