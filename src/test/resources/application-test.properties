# Test profile for rate limiting
# Fast refill for quick testing

# Disable graceful shutdown for tests to avoid hanging
server.shutdown=immediate
spring.lifecycle.timeout-per-shutdown-phase=5s

# Per-IP rate limit: 3 requests per 5 seconds
rate-limit.ip.capacity=3
rate-limit.ip.refill-tokens=3
rate-limit.ip.refill-duration=5s

# Global rate limit: 100 requests per minute
rate-limit.global.capacity=100
rate-limit.global.refill-tokens=100
rate-limit.global.refill-duration=1m

# Cache configuration
rate-limit.cache.max-size=1000
rate-limit.cache.expire-duration=5m

# Token budget limits (for testing - low limits)
rate-limit.tokens.ip.per-minute=500
rate-limit.tokens.ip.per-hour=1000
rate-limit.tokens.ip.per-day=5000

rate-limit.tokens.global.per-minute=500
rate-limit.tokens.global.per-hour=5000
rate-limit.tokens.global.per-day=50000

# Input validation
rate-limit.input.max-query-length=2000
rate-limit.input.max-estimated-input-tokens=500
