services:
  jmix-mcp-docs:
    build:
      context: .
      dockerfile: Dockerfile
    image: jmix-mcp-docs:latest
    container_name: jmix-mcp-docs
    ports:
      - "8080:8080"
    environment:
      # Jmix AI Backend URL - choose one option:
      #
      # Option 1: Local development (AI Backend on host machine)
      # JMIX_AI_BACKEND_URL: http://host.docker.internal:8081
      #
      # Option 2: Same docker network (service name)
      # JMIX_AI_BACKEND_URL: http://jmix-ai-backend:8081
      #
      # Option 3: From environment variable
      # JMIX_AI_BACKEND_URL: ${JMIX_AI_BACKEND_URL}
      #
      # Default (if not set): http://localhost:8081 (from application.properties)

      JMIX_AI_BACKEND_URL: ${JMIX_AI_BACKEND_URL:-http://host.docker.internal:8081}

      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
