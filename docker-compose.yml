services:
  jmix-mcp-docs:
    build:
      context: .
      dockerfile: Dockerfile
    image: jmix-mcp-docs:latest
    container_name: jmix-mcp-docs
    ports:
      - "8080:8080"
    networks:
      - jmix-ai-network
    environment:
      # URL to Jmix AI Backend (AiAssistant)
      # Change this to your AI Backend service name if in same docker network
      JMIX_AI_BACKEND_URL: ${JMIX_AI_BACKEND_URL:-http://localhost:8081}
 
      # Java options (optional)
      JAVA_OPTS: ${JAVA_OPTS:--Xmx512m}
 
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
networks:
  jmix-ai-network:
    external: true
