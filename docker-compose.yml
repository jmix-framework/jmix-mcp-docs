version: '3.8'
services:
  postgres-vector:
    image: pgvector/pgvector:pg16-trixie
    container_name: postgres-vector-db
    environment:
      POSTGRES_DB: mcp_docs
      POSTGRES_USER: vector_user
      POSTGRES_PASSWORD: vector_pass
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vector_user -d mcp_docs -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  reranker:
    image: mcp-reranker:latest
    ports:
      - "7999:8000"
